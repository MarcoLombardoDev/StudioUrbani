name: Recensioni Google

# Aggiorna assets/data/reviews.json con valutazione e recensioni della scheda
# Google dello Studio. Il sito legge quel file statico: nessuna chiamata a
# Google dal browser dei visitatori.
#
# Serve la chiave Places API: come segreto GOOGLE_MAPS_API_KEY (consigliato) o,
# in mancanza, come variabile con lo stesso nome.
# Facoltativa ma consigliata la variabile GOOGLE_PLACE_ID.
# Se la chiave e' limitata per referrer HTTP, lo script se ne accorge e ripete
# la richiesta dichiarando il dominio del sito; GOOGLE_API_REFERER serve solo a
# indicarne un altro.
# Senza chiave il job termina senza fare nulla, senza segnalare errori.

on:
  schedule:
    - cron: '17 4 * * *'   # ogni giorno alle 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reviews
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scarica le recensioni
        id: fetch
        env:
          # Il posto giusto e' il segreto: Actions maschera i segreti nei log,
          # e i log di un repository pubblico li legge chiunque. La variabile
          # e' accettata come ripiego per non lasciare il job fermo.
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY || vars.GOOGLE_MAPS_API_KEY }}
          GOOGLE_PLACE_ID: ${{ vars.GOOGLE_PLACE_ID }}
          GOOGLE_PLACE_NAME: ${{ vars.GOOGLE_PLACE_NAME }}
          GOOGLE_API_REFERER: ${{ vars.GOOGLE_API_REFERER }}
        run: |
          set +e
          node scripts/fetch-reviews.mjs
          code=$?
          set -e
          if [ "$code" = "78" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "::notice::GOOGLE_MAPS_API_KEY non configurata: aggiornamento saltato."
            exit 0
          fi
          exit $code

      - name: Commit se il file e' cambiato
        if: steps.fetch.outputs.skipped != 'true'
        run: |
          if git diff --quiet -- assets/data/reviews.json; then
            echo "Nessuna variazione da pubblicare."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add assets/data/reviews.json
          git commit -m 'Aggiorna le recensioni Google'
          git push
