name: Recensioni Google

# Aggiorna assets/data/reviews.json con valutazione e recensioni della scheda
# Google dello Studio. Il sito legge quel file statico: nessuna chiamata a
# Google dal browser dei visitatori.
#
# Serve la chiave Places API come SEGRETO GOOGLE_MAPS_API_KEY (non come
# variabile: le variabili vengono stampate in chiaro nei log).
# Facoltativa ma consigliata la variabile GOOGLE_PLACE_ID.
# Se la chiave e' limitata per referrer HTTP, lo script se ne accorge e ripete
# la richiesta dichiarando il dominio del sito; GOOGLE_API_REFERER serve solo a
# indicarne un altro.
# Senza chiave il job termina senza fare nulla, senza segnalare errori.

on:
  schedule:
    - cron: '17 4 * * *'   # ogni giorno alle 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reviews
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # La chiave puo' arrivare SOLO da un segreto. Actions stampa nel log il
      # gruppo env di ogni passo e maschera i soli segreti: una chiave messa
      # nelle variabili del repository finirebbe in chiaro in un log che, su un
      # repository pubblico, e' leggibile da tutti. Non esiste un modo sicuro di
      # usare una variabile qui, perche' anche l'interpolazione dentro un run
      # viene ristampata: quindi il job avvisa e non fa nulla. Non e' un errore,
      # il sito continua a mostrare i dati gia' pubblicati.
      - name: La chiave deve essere un segreto
        id: guard
        if: vars.GOOGLE_MAPS_API_KEY != '' && secrets.GOOGLE_MAPS_API_KEY == ''
        run: |
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "::warning::GOOGLE_MAPS_API_KEY e' una variabile del repository e non viene usata: le variabili finiscono in chiaro nei log. Spostala in Settings -> Secrets and variables -> Actions -> Secrets."

      - name: Scarica le recensioni
        id: fetch
        if: steps.guard.outputs.skip != 'true'
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_PLACE_ID: ${{ vars.GOOGLE_PLACE_ID }}
          GOOGLE_PLACE_NAME: ${{ vars.GOOGLE_PLACE_NAME }}
          GOOGLE_API_REFERER: ${{ vars.GOOGLE_API_REFERER }}
        run: |
          set +e
          node scripts/fetch-reviews.mjs
          code=$?
          set -e
          if [ "$code" = "78" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "::notice::GOOGLE_MAPS_API_KEY non configurata: aggiornamento saltato."
            exit 0
          fi
          exit $code

      - name: Commit se qualcosa e' cambiato
        if: steps.guard.outputs.skip != 'true' && steps.fetch.outputs.skipped != 'true'
        run: |
          git add -A assets/data/reviews.json assets/img/reviews
          if git diff --cached --quiet; then
            echo "Nessuna variazione da pubblicare."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'Aggiorna le recensioni Google'
          git push
