name: Recensioni Google

# Aggiorna assets/data/reviews.json con valutazione e recensioni della scheda
# Google dello Studio. Il sito legge quel file statico: nessuna chiamata a
# Google dal browser dei visitatori.
#
# Serve la chiave Places API come SEGRETO GOOGLE_MAPS_API_KEY (non come
# variabile: le variabili vengono stampate in chiaro nei log).
# Facoltativa ma consigliata la variabile GOOGLE_PLACE_ID.
# Se la chiave e' limitata per referrer HTTP, lo script se ne accorge e ripete
# la richiesta dichiarando il dominio del sito; GOOGLE_API_REFERER serve solo a
# indicarne un altro.
# Senza chiave il job termina senza fare nulla, senza segnalare errori.

on:
  schedule:
    - cron: '17 4 * * *'   # ogni giorno alle 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reviews
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # La chiave viene letta solo dal segreto: Actions stampa nel log il gruppo
      # env di ogni passo e maschera i soli segreti, quindi una chiave messa
      # nelle variabili finirebbe in chiaro in un log che, su un repository
      # pubblico, e' leggibile da tutti. Una variabile con lo stesso nome non
      # entra mai nell'ambiente, ma resta scritta in chiaro nelle impostazioni:
      # va cancellata. Il contesto secrets non e' usabile in un if, percio' qui
      # si guarda soltanto la variabile.
      - name: Avvisa se resta una variabile con la chiave
        if: vars.GOOGLE_MAPS_API_KEY != ''
        run: |
          echo "::warning::Esiste ancora una variabile GOOGLE_MAPS_API_KEY. Non viene usata, la chiave si legge dal segreto, ma il valore resta scritto in chiaro. Cancellala da Settings -> Secrets and variables -> Actions -> Variables."

      - name: Scarica le recensioni
        id: fetch
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          # Il place id non e' un segreto e sta bene fra le variabili; se pero'
          # e' stato messo fra i segreti, va letto da la' invece di ricadere
          # sulla ricerca per nome.
          GOOGLE_PLACE_ID: ${{ vars.GOOGLE_PLACE_ID || secrets.GOOGLE_PLACE_ID }}
          GOOGLE_PLACE_NAME: ${{ vars.GOOGLE_PLACE_NAME }}
          GOOGLE_API_REFERER: ${{ vars.GOOGLE_API_REFERER }}
        run: |
          set +e
          node scripts/fetch-reviews.mjs
          code=$?
          set -e
          if [ "$code" = "78" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "::notice::GOOGLE_MAPS_API_KEY non configurata: aggiornamento saltato."
            exit 0
          fi
          exit $code

      - name: Commit se qualcosa e' cambiato
        if: steps.fetch.outputs.skipped != 'true'
        run: |
          git add -A assets/data/reviews.json assets/img/reviews
          if git diff --cached --quiet; then
            echo "Nessuna variazione da pubblicare."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'Aggiorna le recensioni Google'
          git push
