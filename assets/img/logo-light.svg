<!-- Logo Studio Urbani su fondo trasparente.
     Il file originale dipinge il marchio come una macchia piena piu' un
     tracciato bianco sovrapposto che ne ricava la rete: qui quel tracciato
     diventa una maschera, cosi' il bianco non viene disegnato e resta
     trasparente. Rigenerando il logo, ricavare di nuovo le due varianti. -->
